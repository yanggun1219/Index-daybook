name: Update Index Data
on:
  schedule:
    - cron: '15 23 * * 0-4'   # 평일 08:15 KST (미국 마감 후)
    - cron: '25 13 * * 1-5'   # 평일 22:25 KST (한국 마감 후·미국 개장 전)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pykrx pandas
      - name: Update market, KIS futures & news data
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python3 update_data.py --years 5 --krx-days 30
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "chore: update market, KIS futures & news"
          git push
