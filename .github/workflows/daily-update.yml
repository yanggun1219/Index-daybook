name: Update Index Data
on:
  schedule:
    - cron: '15 23 * * 0-4'   # 평일 08:15 KST (미국 마감 후)
    - cron: '30 3 * * 1-5'    # 평일 12:30 KST (점심장)
    - cron: '10 6 * * 1-5'    # 평일 15:10 KST (한국장 마감 20분 전)
    - cron: '45 6 * * 1-5'    # 평일 15:45 KST (한국장 공식 마감)
    - cron: '25 13 * * 1-5'   # 평일 22:25 KST (미국장 개장 전)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: kst
        run: echo "date=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: /tmp/kis_token_cache.json
          key: kis-token-v1-${{ steps.kst.outputs.date }}
      - run: pip install yfinance pykrx pandas
      - name: Update market, KIS futures, BTC & Korean news
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_TOKEN_CACHE: /tmp/kis_token_cache.json
        run: python3 update_data.py --years 5 --krx-days 30
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "chore: update market, KIS futures, BTC & news"
          git push
