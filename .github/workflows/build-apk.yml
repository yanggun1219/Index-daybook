name: Build Android Widget APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip android-widget
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "android-widget*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
          fi
          ls -la android-widget
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build Debug APK
        working-directory: android-widget
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: index-daybook-widget-apk
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
