<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFFFFF" id="meta-theme-color" />
  <title>지수 관측소 v8.1</title>
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      margin: 0;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .tabular { font-variant-numeric: tabular-nums; }
    .drawer-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.32s ease, opacity 0.22s ease;
      opacity: 0;
    }
    .drawer-content.open {
      max-height: 2400px;
      opacity: 1;
    }
    .candle-hit:hover { opacity: 0.78; cursor: pointer; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    #toast-box {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 60;
    }
    #toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body class="min-h-screen antialiased">
  <div id="app-shell" class="min-h-screen pb-14 transition-colors duration-200">
    <!-- Compact Top Bar -->
    <header id="top-bar" class="sticky top-0 z-30 border-b backdrop-blur-md">
      <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <div id="brand-icon" class="w-8 h-8 rounded-xl flex items-center justify-center shrink-0"></div>
          <div>
            <div class="font-black text-[15px] tracking-tight leading-tight">지수 관측소</div>
            <div id="header-stamp" class="text-[11px] font-semibold opacity-60 tabular leading-tight">종가 기준</div>
          </div>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="btn-live-refresh" class="px-3 py-1.5 rounded-full text-xs font-extrabold transition-colors">↻ 새로고침</button>
          <button id="btn-theme-toggle" class="px-2.5 py-1.5 rounded-full text-xs font-extrabold transition-colors" aria-label="테마 전환">다크</button>
        </div>
      </div>
      <!-- Main 4 Tabs -->
      <div class="max-w-lg mx-auto px-4 pb-3">
        <div class="grid grid-cols-4 gap-1.5" role="tablist">
          <button data-tab="KOSPI" class="main-tab py-2 rounded-xl text-xs font-extrabold transition-colors">코스피</button>
          <button data-tab="KOSDAQ" class="main-tab py-2 rounded-xl text-xs font-extrabold transition-colors">코스닥</button>
          <button data-tab="NASDAQ" class="main-tab py-2 rounded-xl text-xs font-extrabold transition-colors">나스닥</button>
          <button data-tab="STOCK" class="main-tab py-2 rounded-xl text-xs font-extrabold transition-colors">종목 관측</button>
        </div>
      </div>
    </header>

    <!-- Main Content (Mobile-First Single Column, Wide Friendly) -->
    <main class="max-w-lg mx-auto px-4 pt-4 space-y-4">
      <!-- Stock Selector Bar (Visible only on STOCK tab) -->
      <section id="stock-bar" class="hidden space-y-2.5">
        <form id="stock-search-form" class="flex items-center gap-2">
          <input id="stock-search-input" type="text" placeholder="종목명 · 6자리 코드 · 미국 티커 (예: SK하이닉스, NVDA)" class="flex-1 px-3.5 py-2.5 rounded-2xl text-xs font-bold outline-none transition-colors" />
          <button id="stock-search-btn" type="submit" class="px-4 py-2.5 rounded-2xl text-xs font-extrabold shrink-0 transition-colors">조회</button>
        </form>
        <div id="stock-presets" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5"></div>
      </section>

      <!-- Soft Pastel Hero Card -->
      <section id="hero-card" class="rounded-[28px] p-5 transition-all duration-200">
        <div class="flex items-center justify-between gap-2 mb-3">
          <span id="phase-pill" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-extrabold"></span>
          <button id="btn-phase-switch" class="text-[11px] font-extrabold underline underline-offset-2 opacity-70 hover:opacity-100"></button>
        </div>

        <!-- Market/Stock Name + Live Status -->
        <div class="flex items-center justify-between gap-2 mb-1">
          <div id="hero-name" class="text-sm font-extrabold opacity-75">코스피</div>
          <div id="hero-extra-tag" class="text-[11px] font-bold opacity-65"></div>
        </div>

        <!-- BIG Current Price + Daily % -->
        <div class="flex items-baseline gap-2.5 flex-wrap">
          <span id="hero-price" class="text-4xl sm:text-[44px] font-black tracking-tight tabular leading-none">-</span>
          <span id="hero-ret" class="text-sm font-extrabold tabular px-2.5 py-0.5 rounded-xl">-</span>
        </div>

        <!-- Small Open Reference Line -->
        <div id="hero-open-line" class="mt-2 text-xs font-semibold tabular opacity-75"></div>

        <!-- BIG Bold Forecast Statement + Direction Score (-100 ~ +100) & Delta -->
        <div id="forecast-row" class="mt-5 pt-4 border-t flex items-center gap-3">
          <div id="signal-icon-box" class="w-11 h-11 rounded-2xl flex items-center justify-center shrink-0"></div>
          <div class="min-w-0 flex-1">
            <div id="forecast-sub" class="text-[11px] font-bold opacity-65"></div>
            <div id="forecast-headline" class="text-lg sm:text-[21px] font-black tracking-tight leading-snug mt-0.5"></div>
          </div>
          <div id="score-box" class="shrink-0 text-right px-3 py-2 rounded-2xl">
            <div id="forecast-score" class="text-2xl sm:text-[26px] font-black tracking-tight tabular leading-none">0</div>
            <div id="forecast-delta" class="text-[10px] font-extrabold tabular mt-1 leading-none opacity-75">방향 점수</div>
          </div>
        </div>
      </section>

      <!-- Candlestick Chart Card (Default = Candle, Toggle = Line) -->
      <section id="chart-card" class="rounded-[24px] p-4 transition-colors duration-200">
        <div class="flex items-center justify-between gap-2 mb-3">
          <div class="min-w-0">
            <span class="text-xs font-extrabold">최근 흐름</span>
            <span id="chart-readout" class="ml-2 text-[11px] font-semibold tabular opacity-65">봉을 눌러 시·종가 확인</span>
          </div>
          <div id="chart-mode-wrap" class="flex items-center gap-1 p-0.5 rounded-xl shrink-0">
            <button id="btn-chart-candle" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition-colors">봉</button>
            <button id="btn-chart-line" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition-colors">라인</button>
          </div>
        </div>
        <div class="relative h-48 w-full">
          <svg id="main-chart-svg" class="w-full h-full" viewBox="0 0 360 190" preserveAspectRatio="none"></svg>
        </div>
      </section>

      <!-- Collapsible Detailed Drawer (All Secondary Features Safely Tucked Inside) -->
      <section>
        <button id="btn-drawer-toggle" class="w-full py-3.5 px-4 rounded-2xl text-xs font-extrabold flex items-center justify-between transition-colors">
          <span>상세 분석 · 선물 · 뉴스 · 시뮬레이터 · 검증</span>
          <span id="drawer-arrow" class="text-sm transition-transform duration-200">▾</span>
        </button>
        <div id="drawer-body" class="drawer-content">
          <div id="drawer-panel" class="mt-2.5 rounded-[24px] p-4 space-y-4">
            <!-- Sub-tabs inside drawer -->
            <div id="drawer-tabs" class="grid grid-cols-4 gap-1.5">
              <button data-dtab="metrics" class="dtab-btn py-1.5 rounded-xl text-[11px] font-extrabold transition-colors">선물·지표</button>
              <button data-dtab="news" class="dtab-btn py-1.5 rounded-xl text-[11px] font-extrabold transition-colors">국내 속보</button>
              <button data-dtab="sim" class="dtab-btn py-1.5 rounded-xl text-[11px] font-extrabold transition-colors">시뮬레이터</button>
              <button data-dtab="verify" class="dtab-btn py-1.5 rounded-xl text-[11px] font-extrabold transition-colors">검증·설정</button>
            </div>
            <div id="drawer-content-area" class="space-y-3 text-xs"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast-box" class="px-4 py-2.5 rounded-full text-xs font-extrabold shadow-lg"></div>

  <script src="data.js"></script>
  <script src="model.js?v=811"></script>
  <script src="app.js?v=811"></script>
</body>
</html>
